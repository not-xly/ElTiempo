<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="El Tiempo">
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>El Tiempo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(180deg,#0b3d91,#3a7bd5);background-attachment:fixed;color:#fff;min-height:100vh;padding:0 14px calc(env(safe-area-inset-bottom) + 20px)}
header{position:sticky;top:0;z-index:10;background:#0b3d91;margin:0 -14px 8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 4px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
h1{font-size:24px;font-weight:700;flex:1}
.btn{border:0;border-radius:18px;padding:8px 14px;font-size:15px;font-weight:600;background:#fff;color:#0b3d91}
.cur{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cur .nm{font-size:19px;font-weight:700}.cur .rg{font-size:13px;opacity:.8}
.star{border:0;background:none;font-size:26px;color:#ffcc33;margin-left:auto;padding:0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:16px;padding:7px 11px;font-size:14px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}
.chip.rec{background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.4)}
.chip.on{background:#fff;color:#0b3d91;font-weight:600}
.seg{display:flex;gap:6px;margin-bottom:6px}
.seg button{flex:1;border:0;border-radius:18px;padding:8px;font-size:15px;font-weight:600;background:rgba(255,255,255,.18);color:#fff}
.seg button.on{background:#fff;color:#0b3d91}
#status{font-size:12px;opacity:.8;margin:4px 0}
.legend{font-size:12px;opacity:.85;margin-bottom:8px}
.day{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:14px;padding:9px 11px;margin-bottom:7px}
.d1{font-weight:600;font-size:15px}.d2{font-size:12px;opacity:.75}
.src{display:flex;align-items:center;gap:6px;font-size:15px;line-height:1.5}
.src .ic{font-size:20px;width:26px;text-align:center}.src b{font-size:16px}.src .r{margin-left:auto;font-size:13px;opacity:.9}
.ok,.warn{text-align:center;font-size:20px}
.empty{text-align:center;margin-top:50px;opacity:.9;font-size:16px;line-height:1.6}
#search{position:fixed;inset:0;z-index:20;background:#0b3d91;padding:calc(env(safe-area-inset-top) + 10px) 14px 20px;display:none;flex-direction:column}
#search.open{display:flex}
.srow{display:flex;gap:8px;margin-bottom:10px}
#q{flex:1;font-size:17px;padding:10px 12px;border-radius:12px;border:0}
#res{overflow-y:auto;flex:1}
.hint{font-size:13px;opacity:.85;margin:6px 2px 10px}
.item{background:rgba(255,255,255,.14);border-radius:12px;padding:11px 12px;margin-bottom:6px}
.item .nm{font-size:16px;font-weight:600}.item .rg{font-size:13px;opacity:.8}
</style>
</head>
<body>
<header>
  <div class="top"><h1>El Tiempo</h1><button class="btn" id="openSearch">🔍 Buscar ciudad</button></div>
  <div class="cur" id="cur"></div>
  <div class="chips" id="chips"></div>
  <div class="seg" id="days"></div>
  <div id="status"></div>
</header>
<div class="legend" id="legend" hidden>🇪🇺 Modelo europeo (ECMWF) · 🇺🇸 Modelo americano (NOAA GFS)<br>✅ coinciden · ⚠️ no coinciden (difieren ≥3° o ≥30% de lluvia)</div>
<div id="list"></div>

<div id="search">
  <div class="srow"><input id="q" type="search" placeholder="Escribe una ciudad…" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn" id="closeSearch">Cerrar</button></div>
  <div id="res"></div>
</div>

<script>
const KEY="eltiempo-v2",DAYS=[3,7,14];
const S=Object.assign({fav:[],rec:[],cur:null,d:7},JSON.parse(localStorage.getItem(KEY)||"{}"));
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const id=c=>c.lat.toFixed(2)+","+c.lon.toFixed(2);
const isUS=c=>c.cc==="US";
// Región: en EE. UU. el estado va siempre, para distinguir ciudades homónimas
let DNs;try{DNs=new Intl.DisplayNames(["es"],{type:"region"})}catch(e){}
const country=c=>{try{return c.cc&&DNs?DNs.of(c.cc):c.c}catch(e){return c.c}};
const region=c=>[c.a,country(c)].filter(Boolean).join(", ");
const short=c=>c.n+(isUS(c)&&c.a?" ("+c.a+")":"");
const WMO={0:["☀️","Despejado"],1:["🌤️","Casi despejado"],2:["⛅","Parcialmente nuboso"],3:["☁️","Nublado"],45:["🌫️","Niebla"],48:["🌫️","Niebla"],51:["🌦️","Llovizna"],53:["🌦️","Llovizna"],55:["🌦️","Llovizna"],56:["🌧️","Llovizna helada"],57:["🌧️","Llovizna helada"],61:["🌧️","Lluvia débil"],63:["🌧️","Lluvia"],65:["🌧️","Lluvia fuerte"],66:["🌧️","Lluvia helada"],67:["🌧️","Lluvia helada"],71:["🌨️","Nieve débil"],73:["🌨️","Nieve"],75:["❄️","Nieve fuerte"],77:["🌨️","Granizo fino"],80:["🌦️","Chubascos"],81:["🌧️","Chubascos"],82:["⛈️","Chubascos fuertes"],85:["🌨️","Chubascos de nieve"],86:["❄️","Chubascos de nieve"],95:["⛈️","Tormenta"],96:["⛈️","Tormenta"],99:["⛈️","Tormenta"]};
const DN=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],MN=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));

function draw(){
  save();
  const c=S.cur;
  $("cur").innerHTML=c?`<div><div class="nm">${esc(c.n)}</div><div class="rg">${esc(region(c))}</div></div><button class="star" id="star" aria-label="Guardar">${isFav(c)?"★":"☆"}</button>`:"";
  if(c)$("star").onclick=()=>{toggleFav(c);save();$("star").textContent=isFav(c)?"★":"☆";drawChips()};
  drawChips();
  const ds=$("days");ds.innerHTML="";
  DAYS.forEach(d=>{const b=document.createElement("button");b.textContent=d+" días";if(d===S.d)b.className="on";b.onclick=()=>{S.d=d;draw()};ds.appendChild(b)});
  if(!c){$("legend").hidden=true;$("status").textContent="";$("list").innerHTML='<div class="empty">Toca <b>🔍 Buscar ciudad</b> para empezar.<br>Guarda tus ciudades con ☆ para tenerlas siempre arriba.</div>';return}
  load();
}
function drawChips(){
  const c=S.cur,ch=$("chips");ch.innerHTML="";
  const add=(x,cls)=>{const b=document.createElement("button");b.className="chip "+cls+(c&&id(x)===id(c)?" on":"");b.textContent=(cls==="fav"?"★ ":"")+short(x);b.onclick=()=>pick(x);ch.appendChild(b)};
  S.fav.forEach(x=>add(x,"fav"));
  S.rec.filter(x=>!isFav(x)).forEach(x=>add(x,"rec"));
  ch.style.display=ch.children.length?"flex":"none";
}
const isFav=c=>S.fav.some(x=>id(x)===id(c));
function toggleFav(c){if(isFav(c))S.fav=S.fav.filter(x=>id(x)!==id(c));else S.fav.push(c)}
function pick(c){
  S.cur=c;
  S.rec=[c,...S.rec.filter(x=>id(x)!==id(c))].slice(0,5);
  closeSearch();draw();scrollTo(0,0);
}

async function load(){
  const c=S.cur,n=S.d,k="eltiempo-cache-"+id(c);
  $("status").textContent="Cargando "+c.n+"…";
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&models=ecmwf_ifs025,gfs_seamless&timezone=auto&forecast_days=14`;
  let data,msg;
  try{const r=await fetch(url);if(!r.ok)throw 0;data=await r.json();localStorage.setItem(k,JSON.stringify({t:Date.now(),data}));msg="Actualizado ahora"}
  catch(e){const s=JSON.parse(localStorage.getItem(k)||"null");if(!s){if(S.cur===c){$("status").textContent="Sin conexión y sin datos guardados de "+c.n;$("list").innerHTML=""}return}data=s.data;msg="Sin conexión · datos del "+new Date(s.t).toLocaleString("es-ES")}
  if(S.cur!==c||S.d!==n)return;
  $("status").textContent=msg;$("legend").hidden=false;
  const x=data.daily,g=(v,m,i)=>x[v+"_"+m]?.[i];
  let h="";
  for(let i=0;i<Math.min(n,x.time.length);i++){
    const dt=new Date(x.time[i]+"T12:00"),lbl=i===0?"Hoy":i===1?"Mañana":DN[dt.getDay()];
    const v=m=>({w:g("weather_code",m,i),mx:g("temperature_2m_max",m,i),mn:g("temperature_2m_min",m,i),p:g("precipitation_probability_max",m,i)});
    const E=v("ecmwf_ifs025"),G=v("gfs_seamless");
    const line=(f,s)=>s.mx==null?`<div class="src">${f} <span style="opacity:.6">sin datos</span></div>`:`<div class="src">${f}<span class="ic">${(WMO[s.w]||["🌡️"])[0]}</span><b>${Math.round(s.mx)}°</b>/${Math.round(s.mn)}°<span class="r">💧${s.p??"–"}%</span></div>`;
    let badge="";
    if(E.mx!=null&&G.mx!=null){
      const bad=Math.abs(E.mx-G.mx)>=3||Math.abs(E.mn-G.mn)>=3||(E.p!=null&&G.p!=null&&Math.abs(E.p-G.p)>=30);
      badge=bad?'<div class="warn">⚠️</div>':'<div class="ok">✅</div>';
    }else badge="<div></div>";
    h+=`<div class="day"><div><div class="d1">${lbl}</div><div class="d2">${dt.getDate()} ${MN[dt.getMonth()]}</div></div><div>${line("🇪🇺",E)}${line("🇺🇸",G)}</div>${badge}</div>`;
  }
  $("list").innerHTML=h;
}

// ---- Búsqueda: siempre se elige de una lista, nunca texto libre ----
let timer,seq=0,found=[];
function openSearch(){$("search").classList.add("open");$("q").value="";$("res").innerHTML='<div class="hint">Escribe al menos 2 letras. Si te equivocas en una letra, te propondré la ciudad correcta.</div>';setTimeout(()=>$("q").focus(),50)}
function closeSearch(){$("search").classList.remove("open");$("q").blur()}
$("openSearch").onclick=openSearch;$("closeSearch").onclick=closeSearch;
$("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(search,350)};
$("q").onkeydown=e=>{if(e.key==="Enter"){clearTimeout(timer);search()}};
async function search(){
  const q=$("q").value.trim(),my=++seq;
  if(q.length<2){$("res").innerHTML="";return}
  $("res").innerHTML='<div class="hint">Buscando…</div>';
  let list=[],fuzzy=false;
  try{
    const r=await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=15&language=es&name="+encodeURIComponent(q))).json();
    list=(r.results||[]).map(p=>({n:p.name,a:p.admin1||"",c:p.country||"",cc:p.country_code||"",lat:p.latitude,lon:p.longitude}));
  }catch(e){}
  if(!list.length){
    // Fallback tolerante a erratas (Photon / OpenStreetMap)
    try{
      const r=await (await fetch("https://photon.komoot.io/api/?limit=10&layer=city&q="+encodeURIComponent(q))).json();
      list=(r.features||[]).map(f=>({n:f.properties.name,a:f.properties.state||"",c:f.properties.country||"",cc:(f.properties.countrycode||"").toUpperCase(),lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]}));
      fuzzy=list.length>0;
    }catch(e){}
  }
  if(my!==seq)return;
  const seen=new Set();found=list.filter(c=>{const k=c.n+"|"+c.a+"|"+c.cc;if(seen.has(k))return false;seen.add(k);return true});
  if(!found.length){$("res").innerHTML='<div class="hint">No encuentro ninguna ciudad con ese nombre. Revisa cómo está escrito.</div>';return}
  const dupUS=found.filter(isUS).length>1;
  $("res").innerHTML=(fuzzy?'<div class="hint">No hay ninguna ciudad escrita exactamente así. ¿Quisiste decir…?</div>':"")+
    (dupUS?'<div class="hint">🇺🇸 Hay varias ciudades con ese nombre en EE. UU.: fíjate en el estado.</div>':"")+
    found.map((c,i)=>`<div class="item" data-i="${i}"><div class="nm">${esc(c.n)}${isFav(c)?" ★":""}</div><div class="rg">${esc(region(c))}</div></div>`).join("");
}
$("res").onclick=e=>{const it=e.target.closest(".item");if(it)pick(found[+it.dataset.i])};

draw();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
